[project]
name = "leaseos"
version = "0.2.0"
description = "Lease abstraction and rent-review intelligence — API + UI"
requires-python = ">=3.11"
dependencies = [
    # Core extraction (week 1)
    "anthropic>=0.40.0",
    "pymupdf>=1.24.0",
    "pydantic>=2.7.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "rich>=13.7.0",
    # API layer
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "pyjwt[crypto]>=2.9.0",
    "cryptography>=43.0.0",
    # Pack generator (week 5) — Word .docx output
    "python-docx>=1.1.0",
    "reportlab>=4.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",  # already a runtime dep but pinned here too for clarity
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    # Suppress pydantic v2 deprecation noise we don't control
    "ignore::DeprecationWarning:pydantic",
]

[project.scripts]
leaseos = "leaseos.cli:cli"
leaseos-api = "leaseos.api.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
